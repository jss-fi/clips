name: Check

on:
  workflow_dispatch:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    env:
      CLIPS_HERMETIC_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm used by the lockfile
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm ci --prefix clips-worker
      - run: npm ci --prefix legacy/update-worker
      - run: npm ci --prefix legacy/telemetry-worker
      - name: Cache pinned native prerequisites
        uses: actions/cache@v4
        with:
          path: .clips-dev/prerequisites
          key: clips-native-prerequisites-v1-${{ hashFiles('scripts/install-prerequisites.ps1') }}
      - name: Stage pinned native prerequisites
        shell: powershell
        run: scripts/install-prerequisites.ps1 -SkipToolInstall -SkipNativeBuild -DownloadRoot .clips-dev/prerequisites
      - run: npm run check
      - run: scripts\build-mpv-host.cmd
      - run: scripts\build-capture-host.cmd
